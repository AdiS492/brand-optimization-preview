<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <base href="/brand-optimization-preview/" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="description" content="Standalone Cascade Plus Admin product optimisation preview." />
  <title>Cascade Plus Admin Preview</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="assets/preview-login.min.css" />
  <script defer src="assets/preview-login.min.js"></script>
</head>
<body>
  <main class="login-shell">
    <section class="login-card" aria-labelledby="previewTitle">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span>LUXSH<small>TECH</small></span></div>
      <p class="eyebrow">Cascade Plus</p>
      <h1 id="previewTitle">Admin preview</h1>
      <p class="intro">Choose a role to open the standalone Product Optimisation Admin demo. No password is required.</p>
      <div class="role-grid" aria-label="Preview roles">
        <button type="button" data-preview-role="Administrator" data-preview-user="Aditi Surve">
          <span class="role-icon">A</span><span><strong>Administrator</strong><small>Full product and mapping controls</small></span>
        </button>
        <button type="button" data-preview-role="Product Manager" data-preview-user="Product Manager">
          <span class="role-icon">P</span><span><strong>Product Manager</strong><small>Review and maintain product details</small></span>
        </button>
        <button type="button" data-preview-role="Auditor" data-preview-user="Audit User">
          <span class="role-icon">R</span><span><strong>Auditor</strong><small>Review mappings and audit history</small></span>
        </button>
      </div>
      <p class="fixture-note"><span aria-hidden="true">●</span> Standalone fixture data · changes are saved only in this browser</p>
    </section>
  </main>
</body>
</html>
